image:
  repository: ghcr.io/anirudhbabu/order-service
  tag: v2.0.0

replicas: 5
port: 8080

# Pod hardening. Validated in CI by the OPA policies in policy/kubernetes.
automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

canary:
  steps:
    - setWeight: 10
    - pause: 2m
    - setWeight: 50
    - pause: 5m
    - setWeight: 100
  successRateThreshold: 0.995
  p99LatencyThresholdSeconds: 0.3
